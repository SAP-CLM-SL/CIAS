<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Arial, sans-serif" font-size="12">

  <!-- MaintenanceOrder -->
  <rect x="20" y="20" width="165" height="148" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <rect x="20" y="20" width="165" height="26" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <rect x="20" y="38" width="165" height="8" fill="#f5f5f5"/>
  <text x="102" y="37" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">MaintenanceOrder</text>
  <line x1="20" y1="46" x2="185" y2="46" stroke="#aaa" stroke-width="1"/>
  <text x="32" y="62" font-size="11" fill="#555">ID</text>
  <text x="32" y="78" font-size="11" fill="#555">number</text>
  <text x="32" y="94" font-size="11" fill="#555">description</text>
  <text x="32" y="110" font-size="11" fill="#555">status</text>
  <text x="32" y="126" font-size="11" fill="#555">scheduledStartDate</text>
  <text x="32" y="142" font-size="11" fill="#555">scheduledEndDate</text>
  <text x="32" y="158" font-size="11" fill="#555">assignedWorkCenter</text>

  <!-- Operation -->
  <rect x="270" y="20" width="155" height="182" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <rect x="270" y="20" width="155" height="26" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <rect x="270" y="38" width="155" height="8" fill="#f5f5f5"/>
  <text x="347" y="37" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Operation</text>
  <line x1="270" y1="46" x2="425" y2="46" stroke="#aaa" stroke-width="1"/>
  <text x="282" y="62" font-size="11" fill="#555">ID</text>
  <text x="282" y="78" font-size="11" fill="#555">code</text>
  <text x="282" y="94" font-size="11" fill="#555">type</text>
  <text x="282" y="110" font-size="11" fill="#555">description</text>
  <text x="282" y="126" font-size="11" fill="#555">status</text>
  <text x="282" y="142" font-size="11" fill="#555">durationTime</text>
  <text x="282" y="158" font-size="11" fill="#555">durationUnit</text>
  <text x="282" y="174" font-size="11" fill="#999" font-style="italic">maintenanceOrder_ID</text>

  <!-- Component -->
  <rect x="270" y="260" width="155" height="112" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <rect x="270" y="260" width="155" height="26" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <rect x="270" y="278" width="155" height="8" fill="#f5f5f5"/>
  <text x="347" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Component</text>
  <line x1="270" y1="286" x2="425" y2="286" stroke="#aaa" stroke-width="1"/>
  <text x="282" y="302" font-size="11" fill="#555">ID</text>
  <text x="282" y="318" font-size="11" fill="#555">quantity</text>
  <text x="282" y="334" font-size="11" fill="#999" font-style="italic">operation_ID</text>
  <text x="282" y="350" font-size="11" fill="#999" font-style="italic">material_ID</text>

  <!-- Material -->
  <rect x="510" y="20" width="155" height="112" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <rect x="510" y="20" width="155" height="26" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <rect x="510" y="38" width="155" height="8" fill="#f5f5f5"/>
  <text x="587" y="37" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Material</text>
  <line x1="510" y1="46" x2="665" y2="46" stroke="#aaa" stroke-width="1"/>
  <text x="522" y="62" font-size="11" fill="#555">ID</text>
  <text x="522" y="78" font-size="11" fill="#555">materialCode</text>
  <text x="522" y="94" font-size="11" fill="#555">materialDescription</text>

  <!-- StockLevel -->
  <rect x="510" y="230" width="155" height="130" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <rect x="510" y="230" width="155" height="26" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <rect x="510" y="248" width="155" height="8" fill="#f5f5f5"/>
  <text x="587" y="247" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">StockLevel</text>
  <line x1="510" y1="256" x2="665" y2="256" stroke="#aaa" stroke-width="1"/>
  <text x="522" y="272" font-size="11" fill="#555">ID</text>
  <text x="522" y="288" font-size="11" fill="#555">warehouse</text>
  <text x="522" y="304" font-size="11" fill="#555">availableQuantity</text>
  <text x="522" y="320" font-size="11" fill="#555">center</text>
  <text x="522" y="336" font-size="11" fill="#999" font-style="italic">material_ID</text>

  <!-- Arrow: MaintenanceOrder → Operation (1 to many) -->
  <line x1="185" y1="94" x2="270" y2="94" stroke="#888" stroke-width="1.2"/>
  <polygon points="270,90 262,94 270,98" fill="#888"/>
  <text x="197" y="89" font-size="10" fill="#888">1</text>
  <text x="253" y="89" font-size="10" fill="#888">*</text>

  <!-- Arrow: Operation → Component (1 to many) -->
  <line x1="347" y1="202" x2="347" y2="260" stroke="#888" stroke-width="1.2"/>
  <polygon points="343,260 347,268 351,260" fill="#888"/>
  <text x="352" y="224" font-size="10" fill="#888">1</text>
  <text x="352" y="253" font-size="10" fill="#888">*</text>

  <!-- Arrow: Component → Material (dashed) -->
  <line x1="425" y1="318" x2="510" y2="78" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <polygon points="506,72 514,72 510,80" fill="#888"/>
  <text x="458" y="196" font-size="10" fill="#888">material</text>

  <!-- Arrow: Material → StockLevel (1 to many) -->
  <line x1="587" y1="132" x2="587" y2="230" stroke="#888" stroke-width="1.2"/>
  <polygon points="583,230 587,238 591,230" fill="#888"/>
  <text x="592" y="168" font-size="10" fill="#888">1</text>
  <text x="592" y="223" font-size="10" fill="#888">*</text>

</svg>
